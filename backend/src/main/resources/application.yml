spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  application:
    name: campus-share-backend
  profiles:
    default: mysql
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

app:
  items:
    cache-ttl: 2m
    popularity-window: 10m
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:campus-share}
  rate-limit:
    login:
      max-requests: 10
      window: 1m
    register:
      max-requests: 5
      window: 1m
    booking:
      max-requests: 10
      window: 1m
  uploads:
    directory: ${UPLOAD_DIRECTORY:./data/uploads}
  auth:
    token-ttl: 8h
