spring:
  application:
    name: campus-share-backend
  profiles:
    default: mysql
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

app:
  uploads:
    directory: ${UPLOAD_DIRECTORY:./data/uploads}
  auth:
    token-ttl: 8h
